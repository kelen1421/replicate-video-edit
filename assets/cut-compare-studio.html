<!doctype html>
<html lang="zh-CN">

<style>

er-spacing:-.035em;white-space:normal;overflow-wrap:anywhere}.project-head .small{margin-top:4px}.grid{display:grid;grid-template-columns:minmax(0,1fr) 322px;align-items:start;gap:14px}.card{border:1px solid var(--line);background:var(--panel);border-radius:12px;overflow:hidden}.card-top{padding:11px 13px;border-bottom:1px solid var(--line)}.card h2{font-size:14px;margin:0}.players{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--line)}.pane{background:#202522;min-width:0}.pane-head{padding:8px 11px;min-height:38px;flex-wrap:nowrap}.pane-head strong{font-size:13px;white-space:nowrap}.pane-head .small{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.chip-dot{width:7px;height:7px;border-radius:100%;background:var(--warm);flex:none}.pane:nth-child(2) .chip-dot{background:var(--green)}.viewport,.overlay{position:relative;height:clamp(180px,42vh,490px);overflow:hidden;background:#0a0c0b}.viewport video,.overlay video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}.video-hint{position:absolute;inset:0;display:grid;align-content:center;justify-items:center;text-align:center;gap:7px;padding:16px;color:var(--muted);cursor:pointer}.video-hint strong{color:#e0e7df;font-size:13px}.video-hint button{margin-top:3px}.gridlines{pointer-events:none;position:absolute;inset:0;background:linear-gradient(90deg,transparent 33.15%,#ffffff4d 33.2%,#ffffff4d 33.45%,transparent 33.5%,transparent 66.45%,#ffffff4d 66.5%,#ffffff4d 66.75%,transparent 66.8%),linear-gradient(0deg,transparent 33.15%,#ffffff4d 33.2%,#ffffff4d 33.45%,transparent 33.5%,transparent 66.45%,#ffffff4d 66.5%,#ffffff4d 66.75%,transparent 66.8%)}.overlay{display:grid;place-items:center}.overlay .overlay-base{position:absolute;overflow:hidden}.overlay #overlayGuide{inset:auto}.transport{padding:10px 13px;display:grid;gap:7px;border-top:1px solid var(--line)}.transport .clock{font-size:12px;white-space:nowrap}.transport select{width:auto;font-size:12px}.transport button{padding:5px 8px;font-size:12px}.transport #play{min-width:63px}.scrub-row{min-width:0}.scrub-row input{flex:1;margin:0}.settings,.timeline-body{padding:12px 13px}.two{display:grid;grid-template-columns:1fr 1fr;gap:7px}.range-head{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);margin-bottom:5px}.range-head button{padding:3px 6px;font-size:11px}.timeline{margin-top:14px}.bar{display:flex;height:24px;background:#111513;border:1px solid var(--line);border-radius:5px;overflow:hidden}.bar button{min-width:0;padding:0 2px;overflow:hidden;text-overflow:clip;background:#3a5142;border:0;border-right:1px solid #1a231d;border-radius:0;font-size:10px;color:#e1ece3}.bar button:nth-of-type(even){background:#455f4d}.bar button.on{color:#282218;background:var(--warm)}.bar i{background:#111513}.segments{display:grid;gap:5px;margin-top:9px}.segment{padding:8px 9px;display:grid;grid-template-columns:24px minmax(0,1fr) minmax(106px,auto) minmax(90px,30%);gap:7px;align-items:center;width:100%;text-align:left}.segment .s-name,.segment .s-ref{overflow:hidden;text-overflow:ellipsis}.segment .s-name{font-size:13px;font-weight:700}.segment .s-ref{font-size:11px;color:var(--muted);justify-self:end}.segment .s-time{font-size:11px;color:var(--muted)}.segment.on{background:#3b3426}.asset-list{display:grid;gap:6px;max-height:220px;overflow:auto}.asset{display:flex;align-items:center;gap:8px;padding:8px;background:#242b26;border-radius:6px}.asset div{min-width:0;overflow-wrap:anywhere}.asset a{white-space:nowrap}.search-row{align-items:end}.search-row button{padding-block:7px}.note{min-height:24px;color:var(--warm);font-size:12px;overflow-wrap:anywhere}.details{border-top:1px solid var(--line);padding-top:8px}.details summary{color:#d1d8d2;font-size:12px;cursor:pointer}.markers{display:flex;gap:4px;flex-wrap:wrap;margin:7px 0}.markers button{font-size:11px;padding:3px 5px}.dialog{width:min(calc(100% - 24px),630px);border:1px solid #536154;border-radius:12px;color:inherit;background:#1e2420;padding:0}.dialog::backdrop{background:#0009}.dialog-content{padding:15px}.dialog h2{margin:0;font-size:16px}.dialog hr{border:0;border-top:1px solid var(--line);width:100%}.dialog .asset-list{max-height:155px}.project-actions{flex-wrap:wrap}.spacer{min-height:4px}.nowrap{white-space:nowrap}.format-actions{gap:5px}.format-actions select{max-width:110px}.format-actions #alpha{width:82px}.sr-only{position:absolute!important;height:1px;width:1px;overflow:hidden;clip-path:inset(50%)}
@media(max-width:1080px){.grid{grid-template-columns:minmax(0,1fr) 287px}.shell{padding-block:18px}.segment{grid-template-columns:20px minmax(0,1fr) auto}.segment .s-ref{display:none}}
@media(max-width:810px){.grid{grid-template-columns:1fr}.inspector{grid-row:2}.viewport,.overlay{height:clamp(160px,37vh,340px)}.top-inner{padding-block:6px}.project-actions{gap:4px}}
@media(max-width:460px){.top-inner button{padding:5px 6px;font-size:11px}.brand{font-size:13px}.pane-head{padding:5px}.pane-head .small{font-size:10px}.transport,.settings,.timeline-body{padding:8px}.timestamp{font-size:10px}.format-actions{gap:3px}.segment{padding:6px}}

#right::cue{color:#fff;background:rgba(0,0,0,.76);font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-weight:550;font-style:italic;font-size:var(--cue-size)}
body.ready-pair .viewport{height:auto;aspect-ratio:var(--video-ratio,16/9);max-height:56vh}
@media(min-width:811px){body.ready-pair .shell,body.ready-pair .top-inner{max-width:1830px}body.ready-pair .grid{grid-template-columns:minmax(0,1fr) minmax(238px,17vw)}}

</head>
<body>
<header class="topbar"><div class="top-inner line between">
  <div class="brand"><span class="brand-icon" aria-hidden="true"><i></i><i></i></span>剪辑对照台</div>
  <nav class="line project-actions" aria-label="项目">
    <button id="newProject" class="quiet">新建</button>
    <button id="importProject" class="quiet">导入项目</button>
    <button id="exportProject">导出项目</button>
  </nav>
</div></header>
<main class="shell">
  <div class="project-head line between">
    <div><h1 id="projectTitle"></h1><div class="small" id="summary"></div></div>
    <div class="line"><button id="renameProject" class="quiet">项目名称</button><button id="openVersions">成片版本</button><button id="openLibrary">参考库</button></div>
  </div>
  <div class="grid">
    <div class="grow">
      <section class="card" aria-label="同步播放器">
        <div class="card-top line between">
          <h2>同步对照</h2>
          <div class="line format-actions">
            <button id="sideView" class="on" aria-pressed="true">左右</button>
            <button id="overlayView" aria-pressed="false">叠加</button>
            <label id="alphaLabel" class="line" hidden>参考透明度 <input id="alpha" type="range" min="0" max="100" value="50"></label>
            <button id="captionToggle" class="on" aria-pressed="true" hidden>同步字幕</button>
            <button id="gridView" aria-pressed="false">构图线</button>
            <button id="independent" aria-pressed="false" title="单独拖动任一侧，定位参考或成片的入点和出点">单独找点</button>
          </div>
        </div>
        <div id="players" class="players">
          <div class="pane"><div class="pane-head line"><span class="chip-dot"></span><strong>参考</strong><span class="grow small" id="referenceName"></span><span id="leftTime" class="timestamp small"></span></div>
            <div class="viewport" id="leftViewport"><video id="left" preload="metadata" playsinline muted></video><div class="video-hint" id="leftHint"><strong></strong><span class="small"></span><button>选参考文件</button></div><div class="gridlines" hidden></div></div></div>
          <div class="pane"><div class="pane-head line"><span class="chip-dot"></span><strong>成片</strong><span class="grow small" id="versionName"></span><span id="rightTime" class="timestamp small"></span></div>
            <div class="viewport" id="rightViewport"><video id="right" preload="metadata" playsinline></video><div class="video-hint" id="rightHint"><strong></strong><span class="small"></span><button>选成片文件</button></div><div class="gridlines" hidden></div></div></div>
        </div>
        <div id="overlay" class="overlay" hidden><div class="overlay-base" id="overlayBase"></div><div id="overlayGuide" class="gridlines" hidden></div><span class="video-hint" id="overlayHint" hidden>选好两侧视频后可叠加</span></div>
        <div class="transport">
          <div class="line scrub-row"><span class="clock mono" id="segmentClock">0:00.00</span><label for="scrub" class="sr-only">段内进度</label><input id="scrub" type="range" min="0" max="1" step=".001" value="0"><span class="clock mono" id="durationClock">0:00.00</span></div>
          <div class="line between">
            <div class="line"><button id="play" class="accent">播放</button><button id="frameBack" title="按成片帧率后退一帧">−1 帧</button><button id="frameForward" title="按成片帧率前进一帧">+1 帧</button><button id="prev" title="上一段">上段</button><button id="next" title="下一段">下段</button><button id="loop" aria-pressed="false">循环</button></div>
            <div class="line"><select id="sync" aria-label="同步方式"><option value="native">按原速</option><option value="phase">对齐段进度</option></select><select id="speed" aria-label="播放速度"><option value=".25">0.25×</option><option value=".5">0.5×</option><option value="1">1×</option><option value="1.5">1.5×</option><option value="2">2×</option></select><select id="audio" aria-label="监听声音"><option value="right">听成片</option><option value="left">听参考</option><option value="none">静音</option></select></div>
          </div>
        </div>
      </section>
      <section class="card timeline" aria-label="分段列表">
        <div class="card-top line between"><div class="line"><h2>分段</h2><span id="count" class="small"></span></div><div class="line"><button id="split">在播放头拆分</button><button id="addSegment">＋ 新分段</button></div></div>
        <div class="timeline-body"><div id="bar" class="bar" aria-label="成片段落"></div><div id="segments" class="segments"></div></div>
      </section>
    </div>
    <aside class="card inspector">
      <div class="card-top line between"><h2>段落检查</h2><span class="small mono" id="ordinal"></span></div>
      <div class="settings stack">
        <div id="emptyInspector" class="help">添加分段后，这里可以设置参考和验收项。</div>
        <div id="fields" class="stack">
          <label>段落名称<input id="segmentTitle" maxlength="70"></label>
          <label>本段参考<select id="reference"></select></label>
          <div class="line between"><a id="originalLink" class="small" target="_blank" rel="noopener noreferrer" hidden>打开参考原页 ↗</a><button id="libraryForSegment" class="quiet">找参考 / 从参考库选择</button></div>
          <div><div class="range-head">成片区间 <button data-mark="b0">设入点</button><button data-mark="b1">设出点</button></div>
            <div class="two"><label>入点<input id="b0" inputmode="decimal"></label><label>出点<input id="b1" inputmode="decimal"></label></div></div>
          <div><div class="range-head">参考区间 <button data-mark="a0">设入点</button><button data-mark="a1">设出点</button></div>
            <div class="two"><label>入点<input id="a0" inputmode="decimal"></label><label>出点<input id="a1" inputmode="decimal"></label></div></div>
          <details class="details" open><summary>镜头切点 <span class="small">点选跳转</span></summary><div id="markers" class="markers"></div><button id="markCut" class="quiet" style="font-size:11px">标记当前帧</button></details>
          <details class="details" open><summary>1:1 逐帧验收</summary><div class="stack" style="margin-top:8px">
            <label>镜头位置<textarea id="framing" placeholder="景别、主体坐标、首 / 中 / 尾帧落点"></textarea></label>
            <label>动画效果<textarea id="motion" placeholder="起止帧、路径、层级、缓动和遮挡"></textarea></label>
            <label>段落备注<textarea id="notes" placeholder="记录参考证据、仍有差异的帧和调整项"></textarea></label>
          </div></details>
          <div class="line between"><label class="grow">验收状态<select id="status"><option>待核对</option><option>需调整</option><option>已核对</option></select></label><button id="removeSegment" class="danger quiet" style="align-self:end">移除分段</button></div>
        </div>
        <div id="notice" class="note" role="status" aria-live="polite"></div>
      </div>
    </aside>
  </div>
</main>
<dialog id="libraryDialog" class="dialog"><div class="card-top line between"><h2 id="libraryTitle">参考库</h2><button data-close="libraryDialog">关闭</button></div>
<div class="dialog-content stack">
  <label>筛选已收录参考<input id="filterRefs" placeholder="输入标题、标签或平台"></label><div class="asset-list" id="refList"></div>
  <div class="line search-row"><label class="grow">搜索新参考<input id="searchWords" placeholder="例：竖屏 正面分割 文字滑入"></label><button id="searchBili">搜 B 站</button><button id="searchDouyin">搜抖音</button></div>
  <hr>
  <div class="line between"><strong>收录参考</strong><button id="addLocalRef">选择本地视频</button></div>
  <div class="two"><label>标题<input id="assetTitle" maxlength="90" placeholder="选填"></label><label>标签<input id="assetTags" maxlength="110" placeholder="例：构图、转场"></label></div>
  <label>来源或视频地址<input id="assetUrl" placeholder="B 站 / 抖音页面，或可直接播放的视频地址"></label>
  <div class="line between"><span class="help">平台页面可保留来源，配上本地视频后可同步。</span><button id="addLink" class="accent">收录链接</button></div>
</div></dialog>
<dialog id="versionsDialog" class="dialog"><div class="card-top line between"><h2>成片版本</h2><button data-close="versionsDialog">关闭</button></div><div class="dialog-content stack"><div id="versionList" class="asset-list"></div><div class="line between"><label class="grow">逐帧帧率<input id="fps" type="number" min="1" max="240" step=".001"></label><button id="addVersion" class="accent" style="align-self:end">添加成片</button></div></div></dialog>
<input id="videoFile" type="file" accept="video/*,.mov,.mp4,.webm,.m4v" hidden>
<input id="projectFile" type="file" accept=".json,application/json" hidden>
<script>
'use strict';
const $ = id => document.getElementById(id);
const STARTER = /* STARTER_DATA */ null;
const KEY = STARTER?.storageKey || 'cut-compare-studio.project.v1';
const MIN_SPAN = .04;
const $L=$('left'), $R=$('right');
document.body.classList.toggle('ready-pair',!!STARTER?.preloaded);
const memory = new Map(), objectUrls = new Map();
let database;
let actionForFile;
let domMessage = 0;
let canSave = true;
let playing = false, epoch=0, seeking=0, pos=0, view='side', guide=false, loop=false, independent=false;
let currentAssets = {left:null,right:null};
const copy = value => JSON.parse(JSON.stringify(value));
const id = () => globalThis.crypto?.randomUUID?.() ?? (Date.now().toString(36)+Math.random().toString(36).slice(2));
const within = (x,lo,hi) => Math.min(hi,Math.max(lo,x));
const clean = (s, n=160) => typeof s==='string' ? s.trim().slice(0,n) : '';
const finite = (x,limit=86400) => typeof x==='number'&&Number.isFinite(x)&&x>=0&&x<=limit;
const time = seconds => {
  if(!Number.isFinite(seconds)) return '—';
  const ms=Math.round(Math.max(0,seconds)*1000), hundredths=Math.floor(ms/10);
  return String(Math.floor(hundredths/6000)).padStart(2,'0')+':'+String(Math.floor(hundredths/100)%60).padStart(2,'0')+'.'+String(hundredths%100).padStart(2,'0');
};
const exactTime = number => Number(number.toFixed(3)).toString();
function parseTime(text){
  const parts=text.trim().split(':');
  if(parts.length>3||parts.some(x=>!/^(?:\d+(?:\.\d+)?|\.\d+)$/.test(x)))return NaN;
  if(parts.length>1&&parts.slice(1).some(x=>Number(x)>=60))return NaN;
  return parts.reduce((a,b)=>a*60+Number(b),0);
}
function safeUrl(value){try{const url=new URL(value);return ['https:','http:'].includes(url.protocol)?url.href:'';}catch{return '';}}
function localPath(value){
  return typeof value==='string'&&value.startsWith('./')&&!value.includes('..')&&!/[:\\?#%]/.test(value)?value:'';
}
function empty(title='未命名剪辑'){
  return {schema:1,title,fps:30,references:[],versions:[],segments:[],activeId:'',versionId:'',sync:'native',speed:1,audio:'right'};
}
function validate(payload){
  if(!payload||payload.schema!==1||!Array.isArray(payload.segments)||!Array.isArray(payload.references)||!Array.isArray(payload.versions))throw Error('无法识别这个项目格式');
  const result=empty(clean(payload.title,100)||'未命名剪辑');
  const used=new Set();
  const asset = item=>{
    if(!item||!clean(item.id)||used.has(item.id))throw Error('素材编号缺失或重复');
    used.add(item.id);
    let value='';
    if(item.kind==='path')value=localPath(item.value);
    if(item.kind==='direct'||item.kind==='page')value=safeUrl(item.value);
    if(item.kind==='file')value=clean(item.value,200);
    if(!value)throw Error('素材地址无效');
    const cues=Array.isArray(item.cues)?item.cues.filter(row=>Array.isArray(row)&&row.length===3&&
      Number.isInteger(row[0])&&Number.isInteger(row[1])&&row[0]>=0&&row[1]>row[0]&&typeof row[2]==='string'):undefined;
    return {id:item.id,title:clean(item.title,100)||value,cues,kind:item.kind,value,tags:clean(item.tags),source:safeUrl(item.source),fileName:clean(item.fileName,200)};
  };
  result.references=payload.references.map(asset);
  result.versions=payload.versions.map(asset);
  let end=0;
  const segments=payload.segments.slice().sort((a,b)=>a.b0-b.b0);
  for(const item of segments){
    if(!item||!clean(item.id)||used.has(item.id)||![item.a0,item.a1,item.b0,item.b1].every(x=>finite(x))||item.a1-item.a0<MIN_SPAN-.000001||item.b1-item.b0<MIN_SPAN-.000001||item.b0<end-.000001)throw Error('分段范围无效或相互重叠');
    used.add(item.id);end=item.b1;
    const status=['待核对','需调整','已核对'].includes(item.status)?item.status:'待核对';
    const ranges=Array.isArray(item.ranges)?item.ranges.filter(r=>r&&result.references.some(x=>x.id===r.id)&&finite(r.a0)&&finite(r.a1)&&r.a1-r.a0>=MIN_SPAN-.000001):[];
    result.segments.push({id:item.id,title:clean(item.title,70)||'未命名分段',b0:item.b0,b1:item.b1,a0:item.a0,a1:item.a1,reference:result.references.some(r=>r.id===item.reference)?item.reference:'',notes:clean(item.notes,4500),framing:clean(item.framing,4500),motion:clean(item.motion,4500),ranges,status,cuts:Array.isArray(item.cuts)?item.cuts.filter(x=>finite(x)&&x>item.b0&&x<item.b1).slice(0,500):[]});
  }
  result.activeId=result.segments.some(x=>x.id===payload.activeId)?payload.activeId:result.segments[0]?.id??'';
  result.versionId=result.versions.some(x=>x.id===payload.versionId)?payload.versionId:result.versions[0]?.id??'';
  result.fps=finite(payload.fps,240)&&payload.fps>=1?payload.fps:30;
  result.sync=payload.sync==='phase'?'phase':'native';
  result.speed=[.25,.5,1,1.5,2].includes(payload.speed)?payload.speed:1;
  result.audio=['left','right','none'].includes(payload.audio)?payload.audio:'right';
  return result;
}
function initial(){
  try{const saved=localStorage.getItem(KEY);if(saved)return validate(JSON.parse(saved));}catch{}
  return STARTER?validate(STARTER):empty();
}
let state=initial();

function videosStore(){

      const req=db.transaction('files').objectStore('files').get(asset.id);
      req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);
    });

  }catch{return undefined;}

async function keepFile(asset,file){

  try{
    const db=await videosStore();
    await new Promise((resolve,reject)=>{
      const transaction=db.transaction('files','readwrite');
      transaction.objectStore('files').put(file,asset.id);
      transaction.oncomplete=resolve;transaction.onerror=()=>reject(transaction.error);
      transaction.onabort=()=>reject(transaction.error);

    if(!playing||turn!==epoch)return;

      const list=ordered(),next=list[list.findIndex(item=>item.id===s.id)+1];

function play(){

for(const [side,v] of [['left',$L],['right',$R]]){
  v.onloadedmetadata=()=>{hint(side,'ready');$(side+'Viewport').style.setProperty('--video-ratio',v.videoWidth+'/'+v.videoHeight);jump(pos);refreshSideGuides();if(side==='right')refreshSegments();};
  v.onerror=()=>{if(v.getAttribute('src'))hint(side,'error');displayTransport();};
  v.onseeked=()=>displayTransport();
  const select=()=>useVideoFile(f=>addFile(f,side,side==='left'?reference():version()));
  $(side+'Hint').querySelector('button').onclick=select;
  const box=$(side+'Viewport');
  box.ondragover=e=>e.preventDefault();
  box.ondrop=e=>{e.preventDefault();addFile(e.dataTransfer.files[0],side,side==='left'?reference():version());};
}
$('videoFile').onchange=e=>{if(e.target.files[0])actionForFile?.(e.target.files[0]);};
$('reference').onchange=e=>bindReference(e.target.value);
$('segmentTitle').onchange=e=>{const s=active();if(s){s.title=clean(e.target.value,70)||'未命名分段';save();render();}};
for(const key of ['notes','framing','motion'])$(key).oninput=e=>{if(active()){active()[key]=e.target.value.slice(0,4500);save();}};
$('status').onchange=e=>{if(active()){active().status=e.target.value;save();}};
for(const k of ['a0','a1','b0','b1'])$(k).onchange=e=>setTime(k,parseTime(e.target.value));
for(const mark of document.querySelectorAll('[data-mark]'))mark.onclick=()=>{
  const v=mark.dataset.mark.startsWith('a')?$L:$R;
  if(!playable(v)){notify('先载入对应侧的视频。');return;}
  setTime(mark.dataset.mark,v.currentTime);
};
$('removeSegment').onclick=()=>{
  const s=active();if(!s||!confirm('移除分段「'+s.title+'」？'))return;
  const list=ordered(), i=list.indexOf(s);
  state.segments=state.segments.filter(x=>x!==s);
  const next=list[i+1]??list[i-1];if(next)selectSegment(next.id);else{pause();state.activeId='';pos=0;save();render();}
};
$('play').onclick=()=>playing?pause():play();
$('scrub').oninput=e=>{const position=Number(e.target.value);pause();setIndependent(false);jump(position);};
$('frameBack').onclick=()=>frameStep(-1);
$('frameForward').onclick=()=>frameStep(1);
$('prev').onclick=()=>moveSegment(-1);$('next').onclick=()=>moveSegment(1);
$('loop').onclick=()=>{loop=!loop;$('loop').classList.toggle('on',loop);$('loop').setAttribute('aria-pressed',String(loop));};
$('speed').onchange=e=>{const resume=playing;pause();state.speed=Number(e.target.value);save();if(resume)play();};
$('sync').onchange=e=>{const resume=playing;pause();state.sync=e.target.value;save();jump(pos);if(resume)play();};
$('audio').onchange=e=>{const resume=playing;pause();state.audio=e.target.value;setAudio();save();if(resume)play();};
$('fps').onchange=e=>{const v=Number(e.target.value);if(finite(v,240)&&v>=1){state.fps=v;save();}else e.target.value=state.fps;};
$('sideView').onclick=()=>changeView('side');$('overlayView').onclick=()=>changeView('overlay');
$('alpha').oninput=e=>{$L.style.opacity=Number(e.target.value)/100;};$('gridView').onclick=setGrid;
window.addEventListener('resize',()=>{refreshSideGuides();refreshOverlay();});
$('independent').onclick=()=>{pause();if(view==='overlay')changeView('side');setIndependent(!independent);if(!independent)jump(pos);};
$('markCut').onclick=()=>{
  const s=active();if(!s)return;
  const t=Math.round((independent&&playable($R)?$R.currentTime:s.b0+pos)*1000)/1000;
  if(t<=s.b0||t>=s.b1){notify('切点须落在本段入出点之间。');return;}
  if(!s.cuts.some(x=>Math.abs(x-t)<.5/state.fps)){s.cuts.push(t);s.cuts.sort((a,b)=>a-b);save();refreshInspector();}
};
$('split').onclick=splitSegment;$('addSegment').onclick=addSegment;
$('openLibrary').onclick=showLibrary;$('libraryForSegment').onclick=showLibrary;
$('openVersions').onclick=()=>{refreshVersionDialog();$('versionsDialog').showModal();};
$('filterRefs').oninput=refreshLibrary;
$('searchBili').onclick=()=>searchPlatform('bili');$('searchDouyin').onclick=()=>searchPlatform('douyin');
$('addLink').onclick=addReferenceLink;$('addLocalRef').onclick=()=>useVideoFile(f=>addFile(f,'left'));
$('addVersion').onclick=()=>useVideoFile(f=>addFile(f,'right'));
for(const el of document.querySelectorAll('[data-close]'))el.onclick=()=>$(el.dataset.close).close();
$('newProject').onclick=()=>{
  if(!confirm('新建会替换当前工作区。已导出的项目可重新导入。继续？'))return;
  pause();state=empty();pos=0;save();render(true);
};
$('renameProject').onclick=()=>{
  const text=prompt('项目名称',state.title);
  if(text!==null&&clean(text,100)){state.title=clean(text,100);save();render();}
};
$('importProject').onclick=()=>{$('projectFile').value='';$('projectFile').click();};
$('projectFile').onchange=e=>importProject(e.target.files[0]);$('exportProject').onclick=downloadProject;
window.addEventListener('keydown',e=>{
  if(e.altKey||e.ctrlKey||e.metaKey||e.shiftKey||e.target.closest('input,textarea,select,button,a,dialog,[contenteditable]'))return;
  if(e.code==='Space'){e.preventDefault();playing?pause():play();}
  if(e.key==='ArrowLeft'){e.preventDefault();$('frameBack').click();}
  if(e.key==='ArrowRight'){e.preventDefault();$('frameForward').click();}
});

const captionButton=$('captionToggle');
let captionTrack=null,captionRows=null,captionsEnabled=true;
function sizeCaptions(){
  const box=$R.getBoundingClientRect();
  if(box.width&&box.height){
    const h=Math.min(box.height,box.width*($R.videoHeight||720)/($R.videoWidth||1280));
    $R.style.setProperty('--cue-size',(h*.048)+'px');
  }
}
function refreshCaptions(){
  const rows=version()?.cues;
  captionButton.hidden=!rows?.length;
  if(!rows?.length&&!captionTrack)return;
  if(!captionTrack)captionTrack=$R.addTextTrack('captions','同步字幕','zh');
  if(rows!==captionRows){
    captionTrack.mode='hidden';
    for(const cue of Array.from(captionTrack.cues||[]))captionTrack.removeCue(cue);
    for(const [start,end,words] of rows||[]){
      // Some browsers include the exact end instant when paused on a cut.
      const cue=new VTTCue(start/1000,(end-.5)/1000,words);
      cue.snapToLines=false;cue.line=87.2;cue.position=50;cue.size=96;cue.align='center';
      captionTrack.addCue(cue);
    }
    captionRows=rows;
  }
  captionTrack.mode=captionsEnabled&&rows?.length?'showing':'disabled';
  sizeCaptions();
}
captionButton.onclick=()=>{
  captionsEnabled=!captionsEnabled;refreshCaptions();
  captionButton.setAttribute('aria-pressed',String(captionsEnabled));
  captionButton.classList.toggle('on',captionsEnabled);
};
new ResizeObserver(sizeCaptions).observe($R);
$R.addEventListener('loadedmetadata',sizeCaptions);

render();
</script>
</body>
</html>
